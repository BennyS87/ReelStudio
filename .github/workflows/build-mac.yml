# Builds Reel Studio on GitHub's Macs and offers the finished app as a download.
# Runs every time you upload changes, or by hand from the Actions tab.
name: Build Reel Studio for Mac

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150

    steps:
      - name: Get the project files
        uses: actions/checkout@v4

      - name: Set up the build (downloads JUCE and Tracktion Engine)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build the app (works on Apple Silicon and Intel Macs)
        run: cmake --build build --config Release -j "$(sysctl -n hw.ncpu)"

      - name: Run the self-test
        continue-on-error: true
        run: |
          "build/ReelStudio_artefacts/Release/Reel Studio.app/Contents/MacOS/Reel Studio" --selftest selftest-output 2>&1 | tee selftest-results.txt

      - name: Sign for local use and zip the app
        run: |
          APP="build/ReelStudio_artefacts/Release/Reel Studio.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "Reel-Studio-mac.zip"

      - name: Offer the app for download
        uses: actions/upload-artifact@v4
        with:
          name: Reel-Studio-mac
          path: |
            Reel-Studio-mac.zip
            selftest-results.txt

